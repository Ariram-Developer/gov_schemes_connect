<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunai - Government Schemes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231D4ED8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src={{ url_for('static', filename='js/main.js') }} defer></script>
</head>
<body>

    <!-- Render both blocks unconditionally. The child templates dictate which one gets populated! -->
    {% block content %}{% endblock %}
    {% block auth_content %}{% endblock %}

    <script>
        lucide.createIcons();
        
        document.addEventListener('DOMContentLoaded', () => {
            const themeBtn = document.getElementById('theme-toggle');
            const htmlEl = document.documentElement;
            
            // 1. Check localStorage for saved theme, default to light
            const savedTheme = localStorage.getItem('app-theme') || 'light';
            htmlEl.setAttribute('data-theme', savedTheme);
            
            if (themeBtn) {
                // 2. Safely set initial icon by injecting a fresh tag
                themeBtn.innerHTML = `<i data-lucide="${savedTheme === 'dark' ? 'sun' : 'moon'}"></i>`;
                lucide.createIcons(); 
                
                // 3. Listen for toggle clicks
                themeBtn.addEventListener('click', () => {
                    const currentTheme = htmlEl.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    
                    htmlEl.setAttribute('data-theme', newTheme);
                    localStorage.setItem('app-theme', newTheme);
                    
                    // Safely swap icon by injecting a fresh tag again
                    themeBtn.innerHTML = `<i data-lucide="${newTheme === 'dark' ? 'sun' : 'moon'}"></i>`;
                    lucide.createIcons();
                });
            }
        });
    </script>
</body>
</html>
